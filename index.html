<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator" role="application">
        <header class="calc-header">
            <h1>Calculator</h1>
        </header>
        <section class="display" aria-live="polite">
            <div class="expression" id="expression" aria-hidden="true"></div>
            <div class="result" id="result" aria-value="result"></div>
        </section>
        <section class="keys" role="group">
            <!-- row1 -->
            <button class="key key-ac" data-action="clear">C</button>
            <button class="key key-del" data-action="delete">⌫</button>
            <button class="key key-paren" data-value="(">(</button>
            <button class="key key-paren" data-value=")">)</button>
            <!-- row2 -->
            <button class="key key-num" data-value="7">7</button>
            <button class="key key-num" data-value="8">8</button>
            <button class="key key-num" data-value="9">9</button>
            <button class="key key-op" data-value="÷">÷</button>
            <!-- row3 -->
            <button class="key key-num" data-value="4">4</button>
            <button class="key key-num" data-value="5">5</button>
            <button class="key key-num" data-value="6">6</button>
            <button class="key key-op" data-value="×">×</button>
            <!-- row4 -->
            <button class="key key-num" data-value="1">1</button>
            <button class="key key-num" data-value="2">2</button>
            <button class="key key-num" data-value="3">3</button>
            <button class="key key-op" data-value="-">-</button>
            <!-- row5 -->
            <button class="key key-num" data-value="0">0</button>
            <button class="key key-dot" data-value=".">.</button>
            <button class="key key-percent" data-action="%">%</button>
            <button class="key key-op" data-value="+">+</button>
            <!-- row6 -->
            <button class="key key-equals" data-action="calculate">=</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
